<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — JSW Motors</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0d1b3e 0%,#1A2D5A 40%,#2E4B8F 100%);display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.4);}
.login-logo{text-align:center;margin-bottom:1.5rem;}
.login-logo img{height:40px;width:auto;}
.login-logo .logo-text{font-family:'Poppins',sans-serif;font-size:1.3rem;font-weight:800;color:#1A2D5A;margin-top:8px;}
.login-logo .logo-sub{font-size:0.78rem;color:#718096;letter-spacing:1px;text-transform:uppercase;}
.form-group{margin-bottom:1rem;}
.form-label{display:block;font-weight:600;font-size:0.85rem;color:#2d3748;margin-bottom:5px;}
.form-control{width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:9px;font-family:'Inter',sans-serif;font-size:0.9rem;transition:border-color 0.2s;}
.form-control:focus{outline:none;border-color:#2E4B8F;box-shadow:0 0 0 3px rgba(46,75,143,0.1);}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#1A2D5A,#2E4B8F);color:#fff;border:none;border-radius:9px;font-family:'Poppins',sans-serif;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.2s;margin-top:0.5rem;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,45,90,0.4);}
.alert-error{background:#fce4ec;border:1px solid #f48fb1;color:#c62828;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:1rem;}
.back-link{text-align:center;margin-top:1rem;font-size:0.82rem;color:#718096;}
.back-link a{color:#2E4B8F;text-decoration:none;font-weight:600;}
.lock-icon{width:56px;height:56px;background:linear-gradient(135deg,#1A2D5A,#2E4B8F);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 1rem;}
.divider{height:1px;background:#e2e8f0;margin:1.25rem 0;}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/JSW_Group_logo.svg/320px-JSW_Group_logo.svg.png"
         alt="JSW" onerror="this.style.display='none'">
    <div class="lock-icon">🔒</div>
    <div class="logo-text">Admin Portal</div>
    <div class="logo-sub">JSW Motors Training Evaluation</div>
  </div>

  {% if error %}
  <div class="alert-error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-control" type="text" name="username" placeholder="Admin username" autofocus required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" placeholder="Admin password" required>
    </div>
    <button type="submit" class="btn-login">Login to Dashboard →</button>
  </form>

  <div class="divider"></div>
  <div class="back-link"><a href="/">← Back to Survey Portal</a></div>
</div>
</body>
</html>
